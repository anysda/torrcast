[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torrcast"
version = "0.1.0"
description = "Поиск торрент-релиза и каст его на ТВ без скачивания и без облака"
readme = "README.md"
# Debian 12 везёт python3.11 и никакого python3.12 в репозиториях у неё нет. Нижняя
# граница снижена до 3.11, чтобы установка оставалась двумя командами; на 3.11 зелены
# и тесты, и mypy --strict.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "anysda", email = "anysdaw@gmail.com" }]
dependencies = [
    "requests>=2.32",
    # Не catt: он гонит любой URL через yt-dlp и не умеет подсказки формата HLS,
    # без которых Default Media Receiver отвечает LOAD ERROR.
    "PyChromecast>=14",
]

[project.scripts]
cast = "torrcast.runtime.main:main"

[dependency-groups]
dev = [
    "grimp>=3.15",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-deadfixtures>=3.1",
    "pytest-testmon>=2.1",
    "pytest-xdist>=3.8",
    "ruff==0.16.1",
    "types-requests>=2.32",
    "vulture>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["torrcast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ARG - параметр, который никто не читает: это мёртвый код в малом, и он же первый
# признак договора, который разъехался с телом. ERA - закомментированный код: по дереву
# он даёт ноль, и правило стоит здесь ровно затем, чтобы так и осталось.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "ERA"]
# RUF001-003: кириллица в строках/докстрингах/комментариях — не «неоднозначные символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Подделка порта обязана держать сигнатуру договора целиком, даже когда телу подделки
# половина параметров не нужна: сценарий зовёт её по договору, а не по телу. Убрать
# «лишний» параметр здесь значит сломать подделку молча. То же у обвязки в scripts:
# колбэки чужих библиотек принимают то, что им передают.
"tests/**" = ["ARG"]
"scripts/**" = ["ARG"]
# Белый список vulture - не код, а перечень имён: они здесь намеренно не определены
# (F821) и стоят голыми выражениями (B018), потому что читает файл только vulture.
"scripts/vulture-whitelist.py" = ["F821", "B018"]

[tool.ruff.lint.isort]
known-first-party = ["torrcast"]

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
files = ["torrcast", "tests", "scripts"]
# Белый список vulture переехал в `scripts`, то есть в охват mypy, но кодом он не
# является: имена в нём намеренно нигде не определены, их читает только vulture.
exclude = ['scripts/vulture-whitelist\.py$']
warn_unreachable = true
warn_unused_configs = true
disallow_any_explicit = false
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "ffmpeg: интеграционный тест с настоящими ffmpeg/ffprobe (гоняется последовательно)",
    "machine: тест с настоящими часами, сокетом или подпроцессом (гоняется последовательно)",
]
