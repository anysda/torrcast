[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torrcast"
version = "0.1.0"
description = "Поиск торрент-релиза и каст его на ТВ без скачивания и без облака"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "anysda", email = "anysdaw@gmail.com" }]
dependencies = [
    "requests>=2.32",
    "catt>=0.12",
]

[project.scripts]
cast = "torrcast.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["torrcast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003: кириллица в строках/докстрингах/комментариях — не «неоднозначные символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["torrcast"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["torrcast", "tests"]
warn_unreachable = true
warn_unused_configs = true
disallow_any_explicit = false
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
